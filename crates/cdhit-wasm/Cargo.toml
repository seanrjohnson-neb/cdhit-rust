[package]
name = "cdhit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the Rust port of CD-HIT."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Single-threaded, no gzip/filesystem: the core is fully portable to wasm32.
cdhit-core = { path = "../cdhit-core", default-features = false }
wasm-bindgen = "0.2"

[features]
default = []
